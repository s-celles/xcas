name: CI

on:
  push:
    branches: [main, dev, '0**']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: Linux
          - os: macos-latest
            name: macOS
          - os: windows-latest
            name: Windows (MSYS2)

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # ── Linux dependencies ──────────────────────────────────────────────
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build gcc g++ \
            libgmp-dev libmpfr-dev libfltk1.3-dev libgiac-dev

      # ── macOS dependencies ─────────────────────────────────────────────
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install meson ninja gmp mpfr fltk@1.3

      # ── Windows (MSYS2) dependencies ───────────────────────────────────
      - name: Setup MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-meson
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-gmp
            mingw-w64-x86_64-mpfr

      # ── Build giac from source (macOS) ─────────────────────────────────
      - name: Build giac from source (macOS)
        if: runner.os == 'macOS'
        run: |
          git clone --depth 1 https://github.com/s-celles/giac.git /tmp/giac-src
          cd /tmp/giac-src/giac
          meson setup builddir --prefix=/usr/local
          meson compile -C builddir
          sudo meson install -C builddir

      # ── Build FLTK 1.3 from source (Windows) ──────────────────────────
      - name: Build FLTK 1.3 from source (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          curl -L -o /tmp/fltk.tar.gz \
            https://www.fltk.org/pub/fltk/1.3.11/fltk-1.3.11-source.tar.gz
          tar xzf /tmp/fltk.tar.gz -C /tmp
          cd /tmp/fltk-1.3.11
          ./configure --prefix=/mingw64 --enable-shared
          make -j$(nproc)
          make install

      # ── Build giac from source (Windows) ───────────────────────────────
      - name: Build giac from source (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          git clone --depth 1 https://github.com/s-celles/giac.git /tmp/giac-src
          cd /tmp/giac-src/giac
          meson setup builddir --prefix=/mingw64
          meson compile -C builddir
          meson install -C builddir

      # ── Configure ──────────────────────────────────────────────────────
      - name: Configure (Linux/macOS)
        if: runner.os != 'Windows'
        run: meson setup builddir

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: meson setup builddir

      # ── Build ──────────────────────────────────────────────────────────
      - name: Build (Linux/macOS)
        if: runner.os != 'Windows'
        run: meson compile -C builddir

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: meson compile -C builddir

      # ── Tests ──────────────────────────────────────────────────────────
      - name: Test (Linux/macOS)
        if: runner.os != 'Windows'
        run: meson test -C builddir

      - name: Test (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: meson test -C builddir

      # ── Upload logs on failure ─────────────────────────────────────────
      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.os }}
          path: builddir/meson-logs/testlog.txt
