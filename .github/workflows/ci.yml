name: CI

on:
  push:
    branches: [main, dev, '0**']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: Linux
          - os: macos-latest
            name: macOS
          - os: windows-latest
            name: Windows (MSYS2)

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # ── Linux dependencies ──────────────────────────────────────────────
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build gcc g++ \
            libgmp-dev libmpfr-dev cmake \
            libgl-dev libglu1-mesa-dev \
            libx11-dev libxext-dev libxft-dev \
            libxinerama-dev libxcursor-dev libxfixes-dev libxrender-dev \
            libpango1.0-dev libpng-dev libjpeg-dev

      # ── macOS dependencies ─────────────────────────────────────────────
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install meson ninja gmp mpfr fltk

      # ── Windows (MSYS2) dependencies ───────────────────────────────────
      - name: Setup MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-meson
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-gmp
            mingw-w64-x86_64-mpfr
            mingw-w64-x86_64-fltk
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-gettext-runtime

      # ── Build FLTK 1.4 from source (Linux) ───────────────────────────
      - name: Build FLTK 1.4 from source (Linux)
        if: runner.os == 'Linux'
        run: |
          git clone --depth 1 --branch release-1.4.2 \
            https://github.com/fltk/fltk.git /tmp/fltk-src
          cd /tmp/fltk-src
          cmake -B build -G Ninja \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DCMAKE_BUILD_TYPE=Release \
            -DFLTK_BUILD_SHARED_LIBS=ON
          cmake --build build --parallel
          sudo cmake --install build
          sudo ldconfig
          fltk-config --version

      # ── Build giac from source (Linux) ────────────────────────────────
      - name: Build giac from source (Linux)
        if: runner.os == 'Linux'
        run: |
          git clone --depth 1 --branch dev https://github.com/s-celles/giac.git /tmp/giac-src
          cd /tmp/giac-src
          meson setup builddir --prefix=/usr/local
          meson compile -C builddir
          sudo meson install -C builddir
          sudo ldconfig

      # ── Build giac from source (macOS) ─────────────────────────────────
      - name: Build giac from source (macOS)
        if: runner.os == 'macOS'
        run: |
          git clone --depth 1 --branch dev https://github.com/s-celles/giac.git /tmp/giac-src
          cd /tmp/giac-src
          meson setup builddir --prefix=/usr/local
          meson compile -C builddir
          sudo meson install -C builddir

      # ── Build giac from source (Windows) ───────────────────────────────
      - name: Build giac from source (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          git clone --depth 1 --branch dev https://github.com/s-celles/giac.git /tmp/giac-src
          cd /tmp/giac-src
          meson setup builddir --prefix=/mingw64
          meson compile -C builddir
          meson install -C builddir

      # ── Configure ──────────────────────────────────────────────────────
      - name: Configure (Linux/macOS)
        if: runner.os != 'Windows'
        env:
          CMAKE_PREFIX_PATH: /usr/local
        run: meson setup builddir

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: meson setup builddir

      # ── Build ──────────────────────────────────────────────────────────
      - name: Build (Linux/macOS)
        if: runner.os != 'Windows'
        run: meson compile -C builddir

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: meson compile -C builddir

      # ── Tests ──────────────────────────────────────────────────────────
      - name: Test (Linux/macOS)
        if: runner.os != 'Windows'
        run: meson test -C builddir

      - name: Test (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: meson test -C builddir

      # ── Upload logs on failure ─────────────────────────────────────────
      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.os }}
          path: builddir/meson-logs/testlog.txt
